<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifremi Unuttum — Kararsız</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar" role="navigation">
    <a href="index.html" class="navbar-brand">Kararsız<span class="brand-dot"></span></a>
    <div class="navbar-actions">
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </nav>

  <main class="auth-page" role="main">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Şifremi Unuttum</h1>
        <p class="auth-subtitle">E-posta adresini gir, sana şifre sıfırlama bağlantısı gönderelim.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">E-posta</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="ornek@mail.com" required />
          <span id="forgot-email-error" class="form-error"></span>
        </div>
        <span id="forgot-general-error" class="form-error" style="margin-bottom:0.75rem"></span>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="forgot-submit-btn">Gönder</button>
      </form>

      <div class="auth-divider">veya</div>
      <div class="auth-footer">
        Şifreni hatırladın mı? <a href="login.html">Giriş Yap</a>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>
  <script src="js/theme-toggle.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('forgot-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors('forgot-form');
        const email = document.getElementById('forgot-email').value.trim();

        if (!email) {
          showFormError('forgot-email', 'E-posta zorunlu.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Gönderiliyor...';

        const { ok, data } = await apiPasswordResetRequest(email);

        submitBtn.disabled = false;
        submitBtn.textContent = 'Gönder';

        if (ok) {
          showToast('Şifre sıfırlama bağlantısı e-postanıza gönderildi.', 'success');
          document.getElementById('forgot-email').value = '';
        } else {
          const errEl = document.getElementById('forgot-general-error');
          errEl.textContent = data.detail || 'Bir hata oluştu.';
          errEl.classList.add('visible');
        }
      });
    });
  </script>
</body>
</html>
