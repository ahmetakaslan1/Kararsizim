<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifre Sıfırlama — Kararsız</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar" role="navigation">
    <a href="index.html" class="navbar-brand">Kararsız<span class="brand-dot"></span></a>
    <div class="navbar-actions">
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </nav>

  <main class="auth-page" role="main">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Yeni Parola Belirle</h1>
        <p class="auth-subtitle">Lütfen hesabın için yeni bir parola oluştur.</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="reset-password" class="form-label">Yeni Parola</label>
          <input type="password" id="reset-password" class="form-input" placeholder="En az 8 karakter" required minlength="8" />
          <span id="reset-password-error" class="form-error"></span>
        </div>
        <span id="reset-general-error" class="form-error" style="margin-bottom:0.75rem"></span>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="reset-submit-btn">Parolayı Güncelle</button>
      </form>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>
  <script src="js/theme-toggle.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      const params = new URLSearchParams(window.location.search);
      const uid = params.get('uid');
      const token = params.get('token');
      
      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('reset-submit-btn');
      const errEl = document.getElementById('reset-general-error');

      if (!uid || !token) {
        errEl.textContent = 'Geçersiz bağlantı. Eksik parametreler.';
        errEl.classList.add('visible');
        submitBtn.disabled = true;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors('reset-form');
        const newPassword = document.getElementById('reset-password').value;

        if (newPassword.length < 8) {
          showFormError('reset-password', 'Parola en az 8 karakter olmalı.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Güncelleniyor...';

        const { ok, data } = await apiPasswordResetConfirm(uid, token, newPassword);

        submitBtn.disabled = false;
        submitBtn.textContent = 'Parolayı Güncelle';

        if (ok) {
          showToast('Parolanız başarıyla güncellendi.', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          errEl.textContent = data.detail || 'Bağlantı geçersiz veya süresi dolmuş.';
          errEl.classList.add('visible');
        }
      });
    });
  </script>
</body>
</html>
