<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Paneli — Kararsız</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .admin-table th, .admin-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .admin-table th {
      background: rgba(0, 0, 0, 0.2);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .admin-table tr:last-child td {
      border-bottom: none;
    }
    .admin-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .badge-admin {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    /* Modal Stilleri */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--bg-card);
      width: 90%;
      max-width: 600px;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      border: 1px solid var(--border);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .modal-body {
      overflow-y: auto;
      flex: 1;
    }
    .poll-list-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    .poll-list-item:last-child { border-bottom: none; }
    .poll-list-item input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
    .poll-list-item div { flex: 1; }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation">
    <a href="index.html" class="navbar-brand">Kararsız<span class="brand-dot"></span></a>
    <div class="navbar-actions">
      <div id="nav-auth"></div>
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </nav>

  <main class="container page-content" role="main">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:1.5rem;">
      <div>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.25rem;">👑 Admin Paneli</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sistemdeki tüm kullanıcıları yönetin.</p>
      </div>
      <a href="index.html" class="btn btn-secondary btn-sm">← Anasayfaya Dön</a>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Kullanıcı Adı</th>
          <th>E-posta</th>
          <th>Kayıt Tarihi</th>
          <th>Anket Sayısı</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="user-list">
        <tr><td colspan="5" style="text-align:center; padding: 2rem;">Yükleniyor...</td></tr>
      </tbody>
    </table>

  </main>

  <!-- Anket Yönetimi Modal -->
  <div class="modal-backdrop" id="pollsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="font-size: 1.2rem; font-weight: 700;" id="modalTitle">Anketler</h2>
        <button class="btn btn-sm" onclick="closePollsModal()" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: rgba(0,0,0,0.1); padding: 0.5rem; border-radius: var(--radius-sm);">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-weight: 600;">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" style="transform: scale(1.2);"> Tümünü Seç
        </label>
        <button class="btn btn-sm" onclick="deleteSelectedPolls()" style="background-color: var(--danger); border-color: var(--danger); color: white;">🗑️ Seçilileri Sil</button>
      </div>
      
      <div class="modal-body" id="modalPollsList">
        <!-- Anketler buraya yüklenecek -->
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/theme-toggle.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      updateNavbar();

      // Sadece adminlerin erişebilmesini sağla
      if (!Auth.isAdmin()) {
        window.location.href = 'index.html';
        return;
      }

      await loadUsers();
    });

    async function loadUsers() {
      const tbody = document.getElementById('user-list');
      const { ok, data } = await apiGetUsers();

      if (!ok) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--danger);">Kullanıcılar yüklenirken bir hata oluştu.</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Kayıtlı kullanıcı bulunmuyor.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      data.forEach(user => {
        const date = new Date(user.date_joined).toLocaleDateString('tr-TR');
        const adminBadge = user.is_admin ? `<span class="badge-admin" style="margin-left: 0.5rem;">Admin</span>` : '';
        const emailInfo = user.email || 'Bilinmiyor';
        
        // Kendisini silemesin
        const isSelf = user.username === Auth.getUser().username;
        const deleteBtn = isSelf 
          ? `<span style="font-size:0.8rem; color:var(--text-muted);">Kendinizsiniz</span>`
          : `<button class="btn btn-sm" onclick="deleteUser(${user.id}, '${user.username}')" style="background-color: #ef4444; border-color: #ef4444; color: white; padding: 0.25rem 0.5rem; font-size: 0.75rem;">🗑️ Sil</button>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>@${user.username}</strong> ${adminBadge}</td>
          <td>${emailInfo}</td>
          <td>${date}</td>
          <td>
            ${user.polls_count > 0 
              ? `<button class="btn btn-sm" onclick="openPollsModal(${user.id}, '${user.username}')" style="background:var(--primary); color:white; border:none; padding: 0.2rem 0.5rem;">${user.polls_count} Anket (Yönet)</button>`
              : `0 Anket`
            }
          </td>
          <td>${deleteBtn}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteUser(id, username) {
      if (confirm(`@${username} kullanıcısını ve ona ait TÜM anketleri kalıcı olarak silmek istediğinize emin misiniz?`)) {
        const { ok } = await apiDeleteUser(id);
        if (ok) {
          showToast('Kullanıcı ve ona ait her şey silindi.', 'success');
          loadUsers(); // Tabloyu yenile
        } else {
          showToast('Silme işlemi başarısız oldu.', 'error');
        }
      }
    }

    // --- Modal Fonksiyonları ---
    let currentUserId = null;

    async function openPollsModal(userId, username) {
      currentUserId = userId;
      document.getElementById('modalTitle').innerText = `@${username} kullanıcısının Anketleri`;
      document.getElementById('pollsModal').style.display = 'flex';
      document.getElementById('selectAllCheckbox').checked = false;
      const listDiv = document.getElementById('modalPollsList');
      listDiv.innerHTML = '<p style="text-align:center;">Yükleniyor...</p>';

      const { ok, data } = await apiGetAdminUserPolls(userId);
      if (!ok) {
        listDiv.innerHTML = '<p style="color:var(--danger); text-align:center;">Anketler yüklenemedi.</p>';
        return;
      }

      if (data.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Hiç anket bulunmuyor.</p>';
        return;
      }

      listDiv.innerHTML = '';
      data.forEach(poll => {
        const date = new Date(poll.created_at).toLocaleDateString('tr-TR');
        const optionsHtml = (poll.options || []).map(opt => 
          `<span style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.7rem;">${opt.text} <strong style="color:var(--primary); margin-left:0.25rem;">${opt.vote_count}</strong></span>`
        ).join('');
        
        listDiv.innerHTML += `
          <div class="poll-list-item">
            <input type="checkbox" class="poll-checkbox" value="${poll.id}">
            <div>
              <div style="font-weight:600; margin-bottom:0.25rem;">${poll.question}</div>
              <div style="font-size:0.8rem; color:var(--text-muted); display:flex; gap:1rem; margin-bottom:0.5rem;">
                <span>🗓️ ${date}</span>
                <span>🗳️ Toplam Oy: ${poll.total_votes || 0}</span>
                <span>🏷️ ${poll.category}</span>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                ${optionsHtml}
              </div>
            </div>
            <button class="btn btn-sm" onclick="deleteSinglePoll(${poll.id})" style="background:transparent; color:var(--danger); border:1px solid var(--danger); padding:0.2rem 0.5rem;">Sil</button>
          </div>
        `;
      });
    }

    function closePollsModal() {
      document.getElementById('pollsModal').style.display = 'none';
      currentUserId = null;
    }

    function toggleSelectAll(checkbox) {
      const checkboxes = document.querySelectorAll('.poll-checkbox');
      checkboxes.forEach(cb => cb.checked = checkbox.checked);
    }

    async function deleteSinglePoll(pollId) {
      if (confirm('Bu anketi kalıcı olarak silmek istediğinize emin misiniz?')) {
        const { ok } = await apiBulkDeletePolls([pollId]);
        if (ok) {
          showToast('Anket silindi.', 'success');
          // Listeyi yenile
          const username = document.getElementById('modalTitle').innerText.split(' ')[0].replace('@', '');
          openPollsModal(currentUserId, username);
          loadUsers(); // Ana sayfadaki sayaç da güncellensin
        } else {
          showToast('Silme işlemi başarısız oldu.', 'error');
        }
      }
    }

    async function deleteSelectedPolls() {
      const checkboxes = document.querySelectorAll('.poll-checkbox:checked');
      if (checkboxes.length === 0) {
        alert('Lütfen silmek için en az bir anket seçin.');
        return;
      }

      if (confirm(`Seçili ${checkboxes.length} anketi kalıcı olarak silmek istediğinize emin misiniz?`)) {
        const pollIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
        const { ok } = await apiBulkDeletePolls(pollIds);
        
        if (ok) {
          showToast(`${checkboxes.length} anket başarıyla silindi.`, 'success');
          const username = document.getElementById('modalTitle').innerText.split(' ')[0].replace('@', '');
          openPollsModal(currentUserId, username);
          loadUsers();
        } else {
          showToast('Silme işlemi başarısız oldu.', 'error');
        }
      }
    }
  </script>
</body>
</html>
