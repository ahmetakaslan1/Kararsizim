<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kararsız — Karar veremeyenler için anket platformu</title>
  <meta name="description" content="Kararsız mısın? Anket oluştur, oyları gör, kararını ver. Herkes oy verebilir." />
  <meta name="keywords" content="kararsizim, kararver,  kararsiz app, ne yapsam karar veremiyorum" />
  
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Ana navigasyon">
    <a href="index.html" class="navbar-brand" aria-label="Kararsız ana sayfa">
      Kararsız<span class="brand-dot" aria-hidden="true"></span>
    </a>
    <div class="navbar-actions">
      <div id="nav-auth"></div>
      <button class="theme-toggle" id="theme-btn" aria-label="Temayı değiştir">🌙</button>
    </div>
  </nav>

  <!-- HERO -->
  <header class="feed-hero" role="banner">
    <div class="container">
      <h1>Ne yapalım <span>bilemiyorum</span> diyenler için</h1>
      <p>Karar veremediklerini herkesin oyuna bırak. Üye olmana gerek yok — oy vermek herkese açık.</p>
      <div id="hero-cta"></div>
    </div>
  </header>

  <!-- POLLS FEED -->
  <main class="container page-content" role="main">
    <span class="sr-only">kararsizim kararver kararsiz app</span>
    
    <!-- FİLTRLEME VE SIRALAMA KONTROLLERİ -->
    <div class="feed-controls" aria-label="Anket filtreleri" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div class="sort-tabs" style="display: flex; gap: 0.5rem;">
        <button class="btn btn-secondary sort-tab active" data-sort="newest" style="background-color: var(--surface-light); border-color: var(--border);">⏱️ En Yeniler</button>
        <button class="btn btn-secondary sort-tab" data-sort="popular" style="background-color: transparent; border-color: transparent; opacity: 0.7;">🔥 Trendler</button>
      </div>
      <div class="category-filter">
        <select id="category-select" class="form-control" aria-label="Kategori Seç" style="min-width: 200px;">
          <option value="all">Tüm Kategoriler</option>
          <option value="genel">Genel</option>
          <option value="kariyer">Kariyer</option>
          <option value="iliski">İlişki</option>
          <option value="teknoloji">Teknoloji</option>
          <option value="alisveris">Alışveriş</option>
          <option value="diger">Diğer</option>
        </select>
      </div>
    </div>
    <div id="polls-grid" class="polls-grid" aria-label="Anket listesi" aria-live="polite">
      <!-- JS tarafından doldurulur -->
    </div>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="empty-state" style="display:none;" aria-live="polite">
      <div class="empty-state-icon" aria-hidden="true">🤔</div>
      <h3>Henüz hiç anket yok</h3>
      <p>İlk anketi sen oluştur!</p>
      <br />
      <a href="create-poll.html" class="btn btn-primary">Anket Oluştur</a>
    </div>
  </main>

  <!-- TOAST -->
  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="js/theme-toggle.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Hero CTA — auth durumuna göre
    document.addEventListener('DOMContentLoaded', () => {
      const cta = document.getElementById('hero-cta');
      if (Auth.isLoggedIn()) {
        cta.innerHTML = `<a href="create-poll.html" class="btn btn-primary btn-lg" id="hero-create-btn">✨ Anket Oluştur</a>`;
      } else {
        cta.innerHTML = `
          <a href="register.html" class="btn btn-primary btn-lg" id="hero-register-btn">Hemen Başla</a>
          <a href="login.html" class="btn btn-secondary btn-lg" id="hero-login-btn" style="margin-left:0.75rem">Giriş Yap</a>
        `;
      }
    });
  </script>
</body>
</html>
