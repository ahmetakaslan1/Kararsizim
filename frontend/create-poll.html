<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anket Oluştur — Kararsız</title>
  <meta name="description" content="Karar veremediğin şeyi anket yap, herkesin oyunu al." />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Ana navigasyon">
    <a href="index.html" class="navbar-brand" aria-label="Kararsız ana sayfa">
      Kararsız<span class="brand-dot" aria-hidden="true"></span>
    </a>
    <div class="navbar-actions">
      <div id="nav-auth"></div>
      <button class="theme-toggle" id="theme-btn" aria-label="Temayı değiştir">🌙</button>
    </div>
  </nav>

  <main class="container page-content" role="main">
    <div style="max-width:560px; margin:0 auto;">

      <!-- BAŞLIK -->
      <div style="margin-bottom:2rem;">
        <a href="index.html" class="btn btn-ghost btn-sm" style="margin-bottom:1rem; display:inline-flex;">
          ← Geri
        </a>
        <h1 style="font-size:1.8rem;font-weight:900;letter-spacing:-0.5px;">
          Anket Oluştur
        </h1>
        <p style="color:var(--text-muted);margin-top:0.4rem;font-size:0.9rem;">
          Karar veremediğin şeyi sor. En az 2, en fazla 5 seçenek ekleyebilirsin.
        </p>
      </div>

      <!-- FORM -->
      <form id="create-poll-form" novalidate>
        <div class="card" style="margin-bottom:1.25rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="poll-question" class="form-label">Sorun nedir? 🤔</label>
            <textarea
              id="poll-question"
              class="form-textarea"
              placeholder="ör. Bu hafta sonu ne yapalım?"
              maxlength="500"
              rows="3"
              required
            ></textarea>
            <div style="display:flex;justify-content:space-between;margin-top:0.35rem;">
              <span id="poll-question-error" class="form-error" role="alert"></span>
              <span id="char-count" style="font-size:0.75rem;color:var(--text-muted);margin-left:auto;">0/500</span>
            </div>
          </div>
        </div>

        <!-- KATEGORİ -->
        <div class="card" style="margin-bottom:1.25rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="poll-category" class="form-label">Kategori</label>
            <select id="poll-category" class="form-control" required>
              <option value="genel" selected>Genel</option>
              <option value="kariyer">Kariyer</option>
              <option value="iliski">İlişki</option>
              <option value="teknoloji">Teknoloji</option>
              <option value="alisveris">Alışveriş</option>
              <option value="diger">Diğer</option>
            </select>
          </div>
        </div>

        <!-- SEÇENEKLER -->
        <div class="card" style="margin-bottom:1.25rem;">
          <p class="form-label" style="margin-bottom:1rem;">Seçenekler</p>
          <div id="options-container">
            <!-- JS tarafından doldurulur -->
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="add-option-btn" style="margin-top:0.25rem;width:100%;">
            + Seçenek Ekle
          </button>
          <span id="options-error" class="form-error" role="alert" style="margin-top:0.5rem;"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="create-submit-btn">
          ✨ Anketi Yayınla
        </button>
      </form>

    </div>
  </main>

  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="js/theme-toggle.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      updateNavbar();

      // Giriş yapılmamışsa login'e yönlendir
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html?next=create-poll.html';
        return;
      }

      const optionsContainer = document.getElementById('options-container');
      const addBtn           = document.getElementById('add-option-btn');
      const questionEl       = document.getElementById('poll-question');
      const charCount        = document.getElementById('char-count');
      const submitBtn        = document.getElementById('create-submit-btn');
      let optionCount = 0;

      // Karakter sayacı
      questionEl.addEventListener('input', () => {
        charCount.textContent = `${questionEl.value.length}/500`;
      });

      // Seçenek ekle
      function addOption(placeholder = '') {
        if (optionCount >= 5) return;
        optionCount++;
        const num = optionCount;

        const row = document.createElement('div');
        row.className = 'option-row';
        row.dataset.num = num;
        row.innerHTML = `
          <div class="option-number" aria-hidden="true">${num}</div>
          <input
            type="text"
            class="form-input option-input"
            placeholder="${placeholder || `Seçenek ${num}`}"
            maxlength="200"
            required
            id="option-${num}"
            aria-label="Seçenek ${num}"
          />
          <button
            type="button"
            class="option-remove"
            aria-label="Seçenek ${num}'i kaldır"
            ${num <= 2 ? 'style="visibility:hidden"' : ''}
          >✕</button>
        `;

        row.querySelector('.option-remove').addEventListener('click', () => {
          row.remove();
          optionCount--;
          // Numaraları güncelle
          document.querySelectorAll('.option-row').forEach((r, i) => {
            const n = i + 1;
            r.dataset.num = n;
            r.querySelector('.option-number').textContent = n;
            const inp = r.querySelector('.option-input');
            inp.id = `option-${n}`;
            inp.setAttribute('aria-label', `Seçenek ${n}`);
            const removeBtn = r.querySelector('.option-remove');
            removeBtn.style.visibility = n <= 2 ? 'hidden' : 'visible';
          });
          // Ekle butonunu göster
          if (optionCount < 5) addBtn.style.display = '';
        });

        optionsContainer.appendChild(row);
        if (optionCount >= 5) addBtn.style.display = 'none';

        // Odaklan
        row.querySelector('.option-input').focus();
      }

      // Başlangıçta 2 seçenek
      addOption('ör. Sinemaya git');
      addOption('ör. Evde kal');

      addBtn.addEventListener('click', () => addOption());

      // FORM GÖNDER
      document.getElementById('create-poll-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Hataları temizle
        document.getElementById('poll-question-error').classList.remove('visible');
        document.getElementById('options-error').classList.remove('visible');

        const question = questionEl.value.trim();
        const category = document.getElementById('poll-category').value;
        const options  = Array.from(document.querySelectorAll('.option-input'))
          .map(inp => inp.value.trim())
          .filter(v => v.length > 0);

        let hasError = false;
        if (!question) {
          const errEl = document.getElementById('poll-question-error');
          errEl.textContent = 'Soru yazman zorunlu.';
          errEl.classList.add('visible');
          hasError = true;
        }
        if (options.length < 2) {
          const errEl = document.getElementById('options-error');
          errEl.textContent = 'En az 2 seçenek doldurmalısın.';
          errEl.classList.add('visible');
          hasError = true;
        }
        if (hasError) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Yayınlanıyor…';

        const { ok, data, status } = await apiCreatePoll(question, category, options);

        submitBtn.disabled = false;
        submitBtn.textContent = '✨ Anketi Yayınla';

        if (ok) {
          showToast('Anket yayınlandı!', 'success');
          setTimeout(() => { window.location.href = `poll-detail.html?id=${data.id}`; }, 700);
        } else {
          const errEl = document.getElementById('options-error');
          const msg = data.question?.[0] || data.options?.[0] || data.detail || 'Bir hata oluştu.';
          errEl.textContent = msg;
          errEl.classList.add('visible');
        }
      });
    });
  </script>
</body>
</html>
